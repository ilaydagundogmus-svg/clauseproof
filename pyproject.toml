[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clauseproof"
version = "0.1.0"
description = "Evidence-based GDPR Art. 28 DPA compliance analysis with verbatim quote verification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "pypdf>=4.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["clauseproof*"]

[tool.setuptools.package-data]
clauseproof = ["rules/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"eval/clauses.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
